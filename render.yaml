services:
  - type: web
    name: campusconnect-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: SEED_COMMITTEE_EMAIL
        sync: false
      - key: SEED_COMMITTEE_PASSWORD
        sync: false
      - key: SEED_COMMITTEE_NAME
        value: Student Events Committee

